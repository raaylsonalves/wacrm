<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu código de verificação do Nordia CRM</title>
</head>
<body style="margin:0;padding:0;background:#f6f9fc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f9fc;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border-radius:12px;">
        <tr>
          <td style="padding:40px 48px 8px 48px;">
            <img src="https://crm.nordiatech.com.br/landing/nordia-logo.png" width="120" alt="Nordia CRM" style="display:block;border:0;height:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:24px 48px 40px 48px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#414552;">
            <p style="margin:0 0 16px 0;">Olá,</p>
            <p style="margin:0 0 16px 0;">Use o código abaixo para confirmar esta ação no <strong>Nordia CRM</strong>:</p>
            <p style="margin:8px 0 24px 0;font-size:28px;line-height:36px;font-weight:700;letter-spacing:6px;color:#1a1b25;">{{ .Token }}</p>
            <p style="margin:0 0 16px 0;font-size:14px;line-height:22px;color:#687385;">Se você não pediu este código, ignore este e-mail e considere alterar sua senha.</p>

            <p style="margin:32px 0 0 0;">Equipe Nordia</p>
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr>
          <td style="padding:24px 48px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8792a2;">
            Nordia Tech · <a href="https://nordiatech.com.br" style="color:#8792a2;">nordiatech.com.br</a><br>
            Você recebeu este e-mail por causa da sua conta no Nordia CRM.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
